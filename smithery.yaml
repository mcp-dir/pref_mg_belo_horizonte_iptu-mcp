# Smithery configuration for Prefeitura MG Belo Horizonte: IPTU (Emissão Guia)
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_pref_mg_belo_horizonte_iptu

name: pref_mg_belo_horizonte_iptu-mcp
displayName: "Prefeitura MG Belo Horizonte: IPTU (Emissão Guia)"
description: >
  Prefeitura MG Belo Horizonte: IPTU (Emissão Guia), consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/pref_mg_belo_horizonte_iptu-mcp
repository: https://github.com/mcp-dir/pref_mg_belo_horizonte_iptu-mcp

tags:
  - pref_mg_belo_horizonte_iptu
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_pref_mg_belo_horizonte_iptu

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_pref_mg_belo_horizonte_iptu/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
